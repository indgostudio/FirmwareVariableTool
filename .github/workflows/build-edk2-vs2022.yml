name: Build targeted AMD PBS AL1 fan restore

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      EDK2_COMMIT: c5aa7e7d94c0e6b3c0202e15dbf7a5c92dd6a01d
      SOURCE_SHA256: 6d55b8a8afa0a1808379b62c6712bc8b0170b6225a7dd073822e0a38c38442c1
      DELTA_SHA256: 35aa8219ba5310d5aafc70b356fffb510493f9bc32f0b61f1d60e54b895bc995
      READONLY_SHA256: f1154e0eea35acaa6fef96b5a455dbb812d5d62c268e196e9e9edaf49a41bc14
      WRITER_SHA256: 441b459b20939cfd61ee3ebbb2338b481e9edf84f246370c3b806ea2f5cfa70d

    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct reviewed source and restore delta
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sourceCommit = '1033aac6850ab4dda7d4166d11a2b06de7ee0e6c'
          New-Item -ItemType Directory -Force -Path 'ci-inputs' | Out-Null
          0..4 | ForEach-Object {
            $name = ('source.part{0:D2}.b64' -f $_)
            $url = "https://raw.githubusercontent.com/indgostudio/FirmwareVariableTool/$sourceCommit/ci/$name"
            Invoke-WebRequest -Uri $url -OutFile "ci-inputs/$name"
          }
          $parts = Get-ChildItem 'ci-inputs/source.part*.b64' | Sort-Object Name
          if ($parts.Count -ne 5) { throw "Expected 5 reviewed source parts" }
          $sourceB64 = ($parts | ForEach-Object { Get-Content $_.FullName -Raw }) -join ''
          [IO.File]::WriteAllBytes('FirmwareVariableTool-source.zip', [Convert]::FromBase64String($sourceB64))
          $sourceHash = (Get-FileHash 'FirmwareVariableTool-source.zip' -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($sourceHash -ne $env:SOURCE_SHA256) { throw "Reviewed source hash mismatch: $sourceHash" }

          $patchB64 = (Get-Content 'ci/amd-pbs-al1-fan-restore.patch.gz.b64' -Raw).Trim()
          [IO.File]::WriteAllBytes('restore.patch.gz', [Convert]::FromBase64String($patchB64))
          $compressed = [IO.File]::ReadAllBytes('restore.patch.gz')
          $input = [IO.MemoryStream]::new($compressed)
          $gzip = [IO.Compression.GZipStream]::new($input, [IO.Compression.CompressionMode]::Decompress)
          $output = [IO.MemoryStream]::new()
          $gzip.CopyTo($output)
          $gzip.Dispose(); $input.Dispose()
          [IO.File]::WriteAllBytes('restore.patch', $output.ToArray())
          $output.Dispose()
          $deltaHash = (Get-FileHash 'restore.patch' -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($deltaHash -ne $env:DELTA_SHA256) { throw "Restore delta hash mismatch: $deltaHash" }

          Expand-Archive 'FirmwareVariableTool-source.zip' -DestinationPath 'reviewed-src'
          $src = Join-Path $env:GITHUB_WORKSPACE 'reviewed-src/FirmwareVariableTool'
          Push-Location $src
          git init | Out-Null
          git apply --check "$env:GITHUB_WORKSPACE/restore.patch"
          if ($LASTEXITCODE -ne 0) { throw 'Restore delta preflight failed' }
          git apply "$env:GITHUB_WORKSPACE/restore.patch"
          if ($LASTEXITCODE -ne 0) { throw 'Restore delta apply failed' }
          Pop-Location

          $required = @(
            "$src/UefiVarToolPkg/AmdPbsAl1FanRestoreTool.inf",
            "$src/UefiVarToolPkg/App/AmdPbsAl1FanRestoreTool.c",
            "$src/UefiVarToolPkg/App/Core/Al1FanRestore.c",
            "$src/UefiVarToolPkg/App/Core/Al1FanRestore.h",
            "$src/host/tests/test_al1_fan_restore.c"
          )
          foreach ($path in $required) { if (-not (Test-Path $path)) { throw "Missing $path" } }
          $core = Get-Content "$src/UefiVarToolPkg/App/Core/Al1FanRestore.h" -Raw
          foreach ($needle in @('0x90u','0x4Bu','0x46u','0x0Fu','0x00000007u','0x6EE713B1u','I_ACCEPT_FIRMWARE_RISK')) {
            if ($core -notmatch [regex]::Escape($needle)) { throw "Compiled restore constant missing: $needle" }
          }
          $inf = Get-Content "$src/UefiVarToolPkg/AmdPbsAl1FanRestoreTool.inf" -Raw
          if ($inf -match 'App/UefiMain\.c|PatchFile\.c|PatchModel\.c') { throw 'Restore INF includes generic writer source' }

      - name: Run host regression suite
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $src = Join-Path $env:GITHUB_WORKSPACE 'reviewed-src/FirmwareVariableTool'
          cmake -S "$src/host" -B "$src/build-host"
          cmake --build "$src/build-host" --config Release
          ctest --test-dir "$src/build-host" -C Release --output-on-failure
          if ($LASTEXITCODE -ne 0) { throw 'Host regression suite failed' }

      - name: Apply reviewed EDK II compatibility fixes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $pkg = 'reviewed-src/FirmwareVariableTool/UefiVarToolPkg'
          $dsc = "$pkg/UefiVarToolPkg.dsc"
          $fixed = New-Object System.Collections.Generic.List[string]
          foreach ($line in Get-Content $dsc) {
            $fixed.Add($line)
            if ($line -eq '  DebugLib|MdePkg/Library/BaseDebugLibNull/BaseDebugLibNull.inf') {
              $fixed.Add('  DevicePathLib|MdePkg/Library/UefiDevicePathLib/UefiDevicePathLib.inf')
              $fixed.Add('  RegisterFilterLib|MdePkg/Library/RegisterFilterLibNull/RegisterFilterLibNull.inf')
              $fixed.Add('  CpuLib|MdePkg/Library/BaseCpuLib/BaseCpuLib.inf')
            }
            if ($line -eq '  MemoryAllocationLib|MdePkg/Library/UefiMemoryAllocationLib/UefiMemoryAllocationLib.inf') {
              $fixed.Add('  PcdLib|MdePkg/Library/BasePcdLibNull/BasePcdLibNull.inf')
            }
            if ($line -eq '  PrintLib|MdePkg/Library/BasePrintLib/BasePrintLib.inf') {
              $fixed.Add('  StackCheckLib|MdePkg/Library/StackCheckLibNull/StackCheckLibNull.inf')
            }
          }
          $fixed | Set-Content -Path $dsc -Encoding ascii
          foreach ($infPath in @("$pkg/ReadOnlyVarTool.inf", "$pkg/WriteVarTool.inf")) {
            $lines = @(Get-Content $infPath)
            if (-not ($lines | Where-Object { $_.Trim() -eq 'gEfiLoadedImageProtocolGuid' })) {
              $lines += ''; $lines += '[Protocols]'; $lines += '  gEfiLoadedImageProtocolGuid'
              $lines | Set-Content -Path $infPath -Encoding ascii
            }
          }
          $patchFile = "$pkg/App/Core/PatchFile.c"
          $patchText = Get-Content $patchFile -Raw
          if ($patchText -notmatch '#include <Library/BaseMemoryLib\.h>') {
            $patchText = $patchText -replace '#include "PatchFile\.h"\r?\n', "#include `"PatchFile.h`"`r`n`r`n#if defined(FW_UEFI_BUILD)`r`n#include <Library/BaseMemoryLib.h>`r`n#endif`r`n"
            $patchText = $patchText -replace 'static void FwZero\(void\* p, size_t n\) \{\r?\n    unsigned char\* b = \(unsigned char\*\)p;\r?\n    for \(size_t i = 0; i < n; \+\+i\) b\[i\] = 0;\r?\n\}', "static void FwZero(void* p, size_t n) {`r`n#if defined(FW_UEFI_BUILD)`r`n    ZeroMem(p, n);`r`n#else`r`n    unsigned char* b = (unsigned char*)p;`r`n    for (size_t i = 0; i < n; ++i) b[i] = 0;`r`n#endif`r`n}"
            $patchText = $patchText -replace '            for \(size_t i = 0; i < len; \+\+i\) out\[i\] = value\[i\];', "#if defined(FW_UEFI_BUILD)`r`n            CopyMem(out, value, len);`r`n#else`r`n            for (size_t i = 0; i < len; ++i) out[i] = value[i];`r`n#endif"
            Set-Content -Path $patchFile -Value $patchText -Encoding ascii -NoNewline
          }

      - name: Locate VS2022 and install NASM
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw 'VS2022 C++ tools not found' }
          $devcmd = Join-Path $vs 'Common7\Tools\VsDevCmd.bat'
          "VS_INSTALL=$vs" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "VS_DEVCMD=$devcmd" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          choco install nasm --version=2.16.03 -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'NASM install failed' }
          'C:\Program Files\NASM' | Out-File $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Checkout pinned EDK II
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path edk2 | Out-Null
          git -C edk2 init
          git -C edk2 remote add origin https://github.com/tianocore/edk2.git
          git -C edk2 fetch --depth 1 origin $env:EDK2_COMMIT
          git -C edk2 checkout --detach FETCH_HEAD
          if ((git -C edk2 rev-parse HEAD).Trim() -ne $env:EDK2_COMMIT) { throw 'EDK II commit mismatch' }
          git -C edk2 submodule update --init --depth 1 BaseTools/Source/C/BrotliCompress/brotli MdePkg/Library/MipiSysTLib/mipisyst
          Copy-Item -Recurse -Force 'reviewed-src/FirmwareVariableTool/UefiVarToolPkg' 'edk2/UefiVarToolPkg'

      - name: Build X64 RELEASE with VS2022
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $workspace = $env:GITHUB_WORKSPACE
          $cmd = @"
          @echo off
          call "%VS_DEVCMD%" -arch=x86 -host_arch=x64
          if errorlevel 1 exit /b %errorlevel%
          "%VCToolsInstallDir%bin\Hostx64\x64\cl.exe" /Bv
          where nasm
          nasm -v
          cd /d "$workspace\edk2"
          call edksetup.bat Rebuild VS2022
          build -a X64 -b RELEASE -t VS2022 -p UefiVarToolPkg\UefiVarToolPkg.dsc
          exit /b %errorlevel%
          "@
          Set-Content build-vs2022.cmd $cmd -Encoding ascii
          cmd.exe /d /c 'build-vs2022.cmd > build.log 2>&1'
          $code = $LASTEXITCODE
          Get-Content build.log
          if ($code -ne 0) { throw "EDK II build failed: $code" }

      - name: Acceptance gate and package artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bin = 'edk2/Build/UefiVarTool/RELEASE_VS2022/X64'
          $restore = Join-Path $bin 'AmdPbsAl1FanRestoreTool.efi'
          $readonly = Join-Path $bin 'ReadOnlyVarTool.efi'
          $writer = Join-Path $bin 'WriteVarTool.efi'
          foreach ($p in @($restore,$readonly,$writer)) { if (-not (Test-Path $p)) { throw "Missing EFI: $p" } }
          $roHash = (Get-FileHash $readonly -Algorithm SHA256).Hash.ToLowerInvariant()
          $wrHash = (Get-FileHash $writer -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($roHash -ne $env:READONLY_SHA256) { throw "ReadOnlyVarTool changed: $roHash" }
          if ($wrHash -ne $env:WRITER_SHA256) { throw "WriteVarTool changed: $wrHash" }
          $restoreHash = (Get-FileHash $restore -Algorithm SHA256).Hash.ToLowerInvariant()
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          Copy-Item $restore artifacts/AmdPbsAl1FanRestoreTool.efi
          Copy-Item build.log artifacts/build.log
          @("TARGET=AmdPbsAl1FanRestoreTool.efi","SHA256=$restoreHash","DELTA_SHA256=$env:DELTA_SHA256","SOURCE_SHA256=$env:SOURCE_SHA256","EDK2_COMMIT=$env:EDK2_COMMIT","READONLY_SHA256=$roHash","WRITER_SHA256=$wrHash","RESTORE_CRC32=0x6EE713B1","DIFF=0x004B:0x46->0x0F") | Set-Content artifacts/acceptance-manifest.txt
          Write-Host "Restore EFI SHA256: $restoreHash"

      - uses: actions/upload-artifact@v4
        with:
          name: AmdPbsAl1FanRestoreTool-efi
          path: |
            artifacts/AmdPbsAl1FanRestoreTool.efi
            artifacts/acceptance-manifest.txt
            artifacts/build.log
          if-no-files-found: error
