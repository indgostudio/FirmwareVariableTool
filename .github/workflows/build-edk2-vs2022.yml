# Build-only workflow; firmware source starts from the reviewed archive.
name: Build EDK II VS2022 EFI binaries

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      EDK2_COMMIT: c5aa7e7d94c0e6b3c0202e15dbf7a5c92dd6a01d
      SOURCE_SHA256: 6d55b8a8afa0a1808379b62c6712bc8b0170b6225a7dd073822e0a38c38442c1
    steps:
      - name: Checkout build branch
        uses: actions/checkout@v4

      - name: Reconstruct reviewed source and apply build-required fixes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $parts = Get-ChildItem 'ci/source.part*.b64' | Sort-Object Name
          if ($parts.Count -ne 5) { throw "Expected 5 source parts, found $($parts.Count)" }
          $b64 = ($parts | ForEach-Object { Get-Content $_.FullName -Raw }) -join ''
          [IO.File]::WriteAllBytes('FirmwareVariableTool-source.zip', [Convert]::FromBase64String($b64))
          $actual = (Get-FileHash 'FirmwareVariableTool-source.zip' -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "Reviewed source SHA256: $actual"
          if ($actual -ne $env:SOURCE_SHA256) { throw "Source SHA256 mismatch: $actual" }
          Expand-Archive 'FirmwareVariableTool-source.zip' -DestinationPath 'reviewed-src'
          $pkg = 'reviewed-src/FirmwareVariableTool/UefiVarToolPkg'
          $dsc = "$pkg/UefiVarToolPkg.dsc"
          if (-not (Test-Path $dsc)) { throw 'Reviewed UefiVarToolPkg missing after extraction' }

          $fixed = New-Object System.Collections.Generic.List[string]
          foreach ($line in Get-Content $dsc) {
            $fixed.Add($line)
            if ($line -eq '  DebugLib|MdePkg/Library/BaseDebugLibNull/BaseDebugLibNull.inf') {
              $fixed.Add('  DevicePathLib|MdePkg/Library/UefiDevicePathLib/UefiDevicePathLib.inf')
              $fixed.Add('  RegisterFilterLib|MdePkg/Library/RegisterFilterLibNull/RegisterFilterLibNull.inf')
              $fixed.Add('  CpuLib|MdePkg/Library/BaseCpuLib/BaseCpuLib.inf')
            }
            if ($line -eq '  MemoryAllocationLib|MdePkg/Library/UefiMemoryAllocationLib/UefiMemoryAllocationLib.inf') {
              $fixed.Add('  PcdLib|MdePkg/Library/BasePcdLibNull/BasePcdLibNull.inf')
            }
            if ($line -eq '  PrintLib|MdePkg/Library/BasePrintLib/BasePrintLib.inf') {
              $fixed.Add('  StackCheckLib|MdePkg/Library/StackCheckLibNull/StackCheckLibNull.inf')
            }
          }
          $fixed | Set-Content -Path $dsc -Encoding ascii
          Write-Host 'Applied build-failure-driven DSC mappings: DevicePathLib, RegisterFilterLib, CpuLib, PcdLib, StackCheckLib.'

          foreach ($inf in @("$pkg/ReadOnlyVarTool.inf", "$pkg/WriteVarTool.inf")) {
            $lines = @(Get-Content $inf)
            if (-not ($lines | Where-Object { $_.Trim() -eq 'gEfiLoadedImageProtocolGuid' })) {
              $protocolIndex = -1
              for ($i = 0; $i -lt $lines.Count; $i++) {
                if ($lines[$i].Trim() -eq '[Protocols]') {
                  $protocolIndex = $i
                  break
                }
              }
              $outLines = New-Object System.Collections.Generic.List[string]
              for ($i = 0; $i -lt $lines.Count; $i++) {
                $outLines.Add($lines[$i])
                if ($i -eq $protocolIndex) {
                  $outLines.Add('  gEfiLoadedImageProtocolGuid')
                }
              }
              if ($protocolIndex -lt 0) {
                $outLines.Add('')
                $outLines.Add('[Protocols]')
                $outLines.Add('  gEfiLoadedImageProtocolGuid')
              }
              $outLines | Set-Content -Path $inf -Encoding ascii
              Write-Host "Declared gEfiLoadedImageProtocolGuid in $inf after run #13 linker failure."
            }
          }

          $patchFile = "$pkg/App/Core/PatchFile.c"
          $patchText = Get-Content $patchFile -Raw
          if ($patchText -notmatch '#include <Library/BaseMemoryLib\.h>') {
            $includePattern = '#include "PatchFile\.h"\r?\n'
            if ($patchText -notmatch $includePattern) { throw 'PatchFile.c include anchor not found' }
            $patchText = $patchText -replace $includePattern, "#include `"PatchFile.h`"`r`n`r`n#if defined(FW_UEFI_BUILD)`r`n#include <Library/BaseMemoryLib.h>`r`n#endif`r`n"

            $zeroPattern = 'static void FwZero\(void\* p, size_t n\) \{\r?\n    unsigned char\* b = \(unsigned char\*\)p;\r?\n    for \(size_t i = 0; i < n; \+\+i\) b\[i\] = 0;\r?\n\}'
            if ($patchText -notmatch $zeroPattern) { throw 'PatchFile.c FwZero anchor not found' }
            $zeroReplacement = "static void FwZero(void* p, size_t n) {`r`n#if defined(FW_UEFI_BUILD)`r`n    ZeroMem(p, n);`r`n#else`r`n    unsigned char* b = (unsigned char*)p;`r`n    for (size_t i = 0; i < n; ++i) b[i] = 0;`r`n#endif`r`n}"
            $patchText = $patchText -replace $zeroPattern, $zeroReplacement

            $copyPattern = '            for \(size_t i = 0; i < len; \+\+i\) out\[i\] = value\[i\];'
            if ($patchText -notmatch $copyPattern) { throw 'PatchFile.c copy-loop anchor not found' }
            $copyReplacement = "#if defined(FW_UEFI_BUILD)`r`n            CopyMem(out, value, len);`r`n#else`r`n            for (size_t i = 0; i < len; ++i) out[i] = value[i];`r`n#endif"
            $patchText = $patchText -replace $copyPattern, $copyReplacement
            Set-Content -Path $patchFile -Value $patchText -Encoding ascii -NoNewline
            Write-Host 'Updated PatchFile.c firmware path to BaseMemoryLib ZeroMem/CopyMem after run #16 CRT linker failure.'
          }

          Get-Content $dsc

      - name: Locate Visual Studio 2022 toolchain
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw 'Visual Studio 2022 with C++ tools not found' }
          $devcmd = Join-Path $vs 'Common7\Tools\VsDevCmd.bat'
          if (-not (Test-Path $devcmd)) { throw "VsDevCmd.bat missing: $devcmd" }
          "VS_INSTALL=$vs" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "VS_DEVCMD=$devcmd" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Visual Studio install: $vs"

      - name: Install pinned NASM
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          choco install nasm --version=2.16.03 -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw "Chocolatey NASM install failed with exit code $LASTEXITCODE" }
          $nasmPath = 'C:\Program Files\NASM\nasm.exe'
          if (-not (Test-Path $nasmPath)) { throw "NASM executable not found after install: $nasmPath" }
          $nasmDir = Split-Path $nasmPath -Parent
          $nasmDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $env:Path = "$nasmDir;$env:Path"
          Write-Host "NASM executable: $nasmPath"
          & $nasmPath -v
          if ($LASTEXITCODE -ne 0) { throw 'NASM version check failed' }

      - name: Checkout pinned EDK II
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path edk2 | Out-Null
          git -C edk2 init
          git -C edk2 remote add origin https://github.com/tianocore/edk2.git
          git -C edk2 fetch --depth 1 origin $env:EDK2_COMMIT
          git -C edk2 checkout --detach FETCH_HEAD
          $actual = (git -C edk2 rev-parse HEAD).Trim()
          Write-Host "EDK II commit: $actual"
          if ($actual -ne $env:EDK2_COMMIT) { throw "EDK II commit mismatch: $actual" }
          git -C edk2 submodule update --init --depth 1 BaseTools/Source/C/BrotliCompress/brotli MdePkg/Library/MipiSysTLib/mipisyst
          if ($LASTEXITCODE -ne 0) { throw 'Failed to initialize required EDK II submodules' }
          Copy-Item -Recurse -Force 'reviewed-src/FirmwareVariableTool/UefiVarToolPkg' 'edk2/UefiVarToolPkg'

      - name: Build X64 RELEASE with VS2022
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $workspace = $env:GITHUB_WORKSPACE
          $cmd = @"
          @echo off
          setlocal
          echo ============================================================
          echo FirmwareVariableTool reproducible EDK II build
          echo Runner OS: %OS%
          echo GitHub runner: %ImageOS% %ImageVersion%
          echo EDK2_COMMIT=%EDK2_COMMIT%
          echo VS_INSTALL=%VS_INSTALL%
          echo ============================================================
          rem EDK II Windows BaseTools default to an IA32 host build.
          call "%VS_DEVCMD%" -arch=x86 -host_arch=x64
          if errorlevel 1 exit /b %errorlevel%
          echo --- MSVC X64 TARGET TOOLCHAIN ---
          "%VCToolsInstallDir%bin\Hostx64\x64\cl.exe" /Bv
          rem /Bv prints version then reports D8003 without a source file; reset status.
          ver >nul
          echo --- NASM TOOLCHAIN ---
          where nasm
          nasm -v
          if errorlevel 1 exit /b %errorlevel%
          echo --- EDK II SETUP / BASETOOLS ---
          cd /d "$workspace\edk2"
          call edksetup.bat Rebuild VS2022
          if not exist "%EDK_TOOLS_PATH%\Bin\Win32\GenFw.exe" exit /b 90
          if not exist "%EDK_TOOLS_PATH%\Bin\Win32\GenFfs.exe" exit /b 91
          if not exist "%EDK_TOOLS_PATH%\Bin\Win32\GenSec.exe" exit /b 92
          echo --- EDK II COMMIT ---
          git rev-parse HEAD
          echo --- UEFI BUILD ---
          build -a X64 -b RELEASE -t VS2022 -p UefiVarToolPkg\UefiVarToolPkg.dsc
          exit /b %errorlevel%
          "@
          Set-Content -Path 'build-vs2022.cmd' -Value $cmd -Encoding ascii
          cmd.exe /d /c 'build-vs2022.cmd > build.log 2>&1'
          $code = $LASTEXITCODE
          Get-Content 'build.log'
          if ($code -ne 0) { throw "EDK II build failed with exit code $code" }

      - name: Verify and stage EFI artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $out = Join-Path $env:GITHUB_WORKSPACE 'edk2/Build/UefiVarTool/RELEASE_VS2022/X64'
          $readOnly = Join-Path $out 'ReadOnlyVarTool.efi'
          $writer = Join-Path $out 'WriteVarTool.efi'
          if (-not (Test-Path $readOnly)) { throw "Missing artifact: $readOnly" }
          if (-not (Test-Path $writer)) { throw "Missing artifact: $writer" }
          New-Item -ItemType Directory -Force -Path 'efi-artifacts' | Out-Null
          Copy-Item $readOnly 'efi-artifacts/ReadOnlyVarTool.efi'
          Copy-Item $writer 'efi-artifacts/WriteVarTool.efi'
          Copy-Item 'build.log' 'efi-artifacts/build.log'
          "EDK II commit: $env:EDK2_COMMIT" | Add-Content 'efi-artifacts/build.log'
          "Build command: build -a X64 -b RELEASE -t VS2022 -p UefiVarToolPkg\UefiVarToolPkg.dsc" | Add-Content 'efi-artifacts/build.log'
          Get-FileHash 'efi-artifacts/ReadOnlyVarTool.efi','efi-artifacts/WriteVarTool.efi' -Algorithm SHA256 | Format-Table -AutoSize | Out-String | Add-Content 'efi-artifacts/build.log'
          Get-ChildItem 'efi-artifacts' | Format-Table Name,Length

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FirmwareVariableTool-build-log
          path: |
            build.log
            build-vs2022.cmd
          if-no-files-found: warn

      - name: Upload EFI binaries
        uses: actions/upload-artifact@v4
        with:
          name: FirmwareVariableTool-efi
          path: efi-artifacts/
          if-no-files-found: error
